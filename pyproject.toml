[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fixpilot"
version = "0.1.0"
description = "Multimodal IT-support agent: reads a photo of a stuck screen, confirms what the user wants, and guides a safe, step-by-step fix with risk guardrails and human escalation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "langgraph>=0.4",
  "langchain-core>=0.3",
  "google-genai>=1.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
adk = ["google-adk>=1.0"]
vertex-rag = ["google-cloud-aiplatform>=1.70"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fixpilot = ["playbooks/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Form()/File() defaults are the framework's intended pattern
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
